<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: url('../static/bg.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 60px;
            background-color: #f5f5f5;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .user-profile {
            display: flex;
            align-items: center;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .content {
            padding: 20px;
            flex: 1;
            overflow: auto;
            background-color: #ffffff;
            margin: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .search-box input {
            border: none;
            outline: none;
            padding: 6px;
            font-size: 14px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
            font-weight: bold;
        }

        .btn {
            padding: 6px 12px;
            font-size: 13px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .view-btn {
            background-color: #2196F3;
            color: white;
            text-decoration: none;
        }

        .view-btn:hover {
            background-color: #1976D2;
        }

        @media (max-width: 600px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    {{template "adminSideNav"}}

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="header-right">
                <div class="user-profile">
                    <img src="../static/avater.jpg" alt="Admin" class="user-avatar" />
                    <span class="user-name">Admin User</span>
                    <span class="material-icons">arrow_drop_down</span>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="content">
            <div class="page-header">
                <h2>Organization</h2>
                <div class="search-box">
                    <span class="material-icons">search</span>
                    <input type="text" id="searchDocuments" placeholder="Search documents...">
                </div>
            </div>

            <!-- Documents Table -->
            <div class="table-container">
                <table id="documentsTable">
                    <thead>
                        <tr>
                            <th>Organization Name</th>
                            <th>CAC Number</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .}}
                            <tr>
                                <td>{{.Name}}</td>
                                <td>{{.CACNumber}}</td>
                                <td>
                                    <a href="/admin_organization_documents/{{.ID}}" class="btn view-btn">View</a>
                                </td>
                            </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Search functionality
            document.getElementById('searchDocuments').addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const rows = document.querySelectorAll('#documentsTable tbody tr');
                
                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    row.style.display = text.includes(searchTerm) ? '' : 'none';
                });
            });
        });
    </script>
</body>
</html>
