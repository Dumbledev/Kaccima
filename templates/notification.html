<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KACCIMA - Notifications</title>
  <link rel="stylesheet" href="../static/user_style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>
    .notification-box {
      background: #f5f5f5;
      border-left: 5px solid #007bff;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 5px;
      position: relative;
    }

    .notification-box.rejected {
      border-left-color: #dc3545;
    }

    .notification-box.warning {
      border-left-color: #ffc107;
    }

    .notification-box.success {
      border-left-color: #28a745;
    }

    .notification-actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      border: none;
    }

    .btn-primary {
      background-color: #007bff;
      color: white;
    }

    .btn-danger {
      background-color: #dc3545;
      color: white;
    }

    .btn-success {
      background-color: #28a745;
      color: white;
    }

    .notification-time {
      font-size: 12px;
      color: #6c757d;
      margin-top: 5px;
    }

    .document-preview {
      background-color: #e9ecef;
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
      font-size: 14px;
    }

    .rejection-reason {
      color: #dc3545;
      font-weight: bold;
      margin-top: 5px;
    }

    .upload-area {
      margin-top: 10px;
      padding: 10px;
      border: 2px dashed #ced4da;
      border-radius: 4px;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li {
      display: inline-block;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-text {
      font-weight: bold;
      font-size: 18px;
    }

    .dashboard-container {
      display: flex;
    }

    .sidebar {
      width: 200px;
      padding: 15px;
      background-color: #f8f9fa;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li {
      margin: 10px 0;
    }

    .sidebar ul li.active a {
      font-weight: bold;
      color: #007bff;
    }

    .dashboard-content {
      flex: 1;
      padding: 20px;
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <div class="logo">
        <img src="/static/logo.png" alt="KACCIMA Logo" width="40" height="40" />
        <span class="logo-text">KACCIMA</span>
      </div>
      <ul>
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/notification">Notifications</a></li>
        <li><a href="/profile">Profile</a></li>
        <li><a href="/sign_out">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main class="dashboard-container">
    <aside class="sidebar">
      <ul>
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/profile">Profile</a></li>
        <li><a href="/organization">Organization Profile</a></li>
        <li class="active"><a href="/notification">Notifications</a></li>
      </ul>
    </aside>

    <section class="dashboard-content">
      <h3>Notifications</h3>
      <div id="notificationsList"> 
        {{range .}}
          <p>{{.Reason}}</p>
          <p>{{.Type}}</p>
          <hr />
        {{end}}
      </div>
    </section>
  </main>
