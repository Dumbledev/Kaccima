<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports - KACCIMA Admin Dashboard</title>
  
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script src="../script.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-image: url('../static/bg.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* Main Content */
    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      height: 60px;
      background-color: #f5f5f5;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }

    .user-profile {
      display: flex;
      align-items: center;
    }

    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .content {
      padding: 20px;
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      margin: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #fff;
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .search-box input {
      border: none;
      outline: none;
      padding: 5px;
    }

    .export-btn {
      background-color: #4CAF50;
      color: white;
      padding: 6px 12px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }

    .export-btn:hover {
      background-color: #45a049;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px; /* Reduced font size */
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background-color: #f2f2f2;
    }

    /* Narrow the Actions column */
    th:last-child, td:last-child {
      width: 80px; /* adjust as needed */
      text-align: center;
    }

    /* Style delete icon */
    .fa-trash {
      color: red;
    }

    /* Optional: space between action icons */
    .actions a {
      margin: 0 5px;
    }
    .container {
  background-color: #fefefe;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
  max-width: 700px;
  margin: 0 auto;
}

.page-header h2 {
  margin-top: 0;
  margin-bottom: 5px;
}

.page-header p {
  margin-top: 0;
  font-size: 14px;
  color: #555;
}

.form-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

label {
  font-weight: 600;
  margin-bottom: 6px;
  color: #333;
}

input[type="text"],
input[type="date"],
select,
textarea {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
  transition: border-color 0.3s ease;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #4CAF50;
  outline: none;
  box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
}

textarea {
  resize: vertical;
}

.form-actions {
  text-align: right;
}

.btn-submit {
  background-color: #4CAF50;
  color: white;
  border: none;
  padding: 10px 20px;
  font-size: 15px;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.btn-submit:hover {
  background-color: #45a049;
}

.success-message {
  margin-top: 20px;
  font-weight: 600;
  color: green;
  font-size: 15px;
}

  </style>
</head>
<body>
  <!-- Sidebar -->
 {{template "adminSideNav"}}


  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <header class="header">
     
      <div class="header-right">
        <div class="user-profile">
           <img src="../static/avater.jpg" alt="Admin" class="user-avatar" />
          <span class="user-name">Admin User</span>
          <span class="material-icons">arrow_drop_down</span>
        </div>
      </div>
    </header>

 <!-- Report Content -->
<div class="content">
  <div class="container">
    <div class="page-header">
      <h2>Submit Admin Report</h2>
      <p>Use this form to report issues related to members, payments, or documents.</p>
    </div>

    <form id="reportForm" class="form-container" method="post" action="/admin_report_member_handler">
      <input type="text" hidden name="organizationId" value="{{.ID}}">
      <input type="text" hidden name="organizationName" value="{{.Name}}">
      <div class="form-group">
        <label for="reportType">Report Type</label>
        <select id="reportType" name="reportType" required>
          <option value="">-- Select Report Type --</option>
          <option value="misconduct">User Misconduct</option>
          <option value="payment">Payment Renewal Issue</option>
          <option value="document">Document Rejection</option>
        </select>
      </div>

      <div class="form-group">
        <label for="memberName">Member Name or Email</label>
        <input type="text" id="memberName" name="memberName" placeholder="Enter member's name or email" value="{{.Email}}" required />
      </div>

      <div class="form-group">
        <label for="reportReason">Description / Reason</label>
        <textarea id="reportReason" name="reportReason" rows="6" placeholder="Describe the issue..." required></textarea>
      </div>

      <div class="form-group">
        <label for="reportDate">Report Date</label>
        <input type="date" id="reportDate" name="reportDate" required />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Submit Report</button>
      </div>
    </form>

    <div id="reportSuccess" class="success-message" style="display: none;">
      ✅ Report successfully submitted!
    </div>
  </div>
</div>

  </main>

  <script>
    document.getElementById('reportForm').addEventListener('submit', function(event) {
      event.preventDefault();

      // Example submission logic
      const form = event.target;
      const reportData = {
        type: form.reportType.value,
        member: form.memberName.value,
        reason: form.reportReason.value,
        date: form.reportDate.value,
      };

      console.log('Report submitted:', reportData);

      // Show success message
      document.getElementById('reportSuccess').style.display = 'block';

      // Clear form
      form.reset();
    });
  </script>
</body>
</html>
