<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports - KACCIMA Admin Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script src="../script.js" defer></script>
 
</head>
<body>
  <!-- Sidebar -->
 {{template "adminSideNav"}}


  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <span class="material-icons" id="sidebarToggle" style="cursor: pointer;">menu</span>
      </div>
      <div class="header-right">
        <div class="user-profile">
           <img src="../static/avater.jpg" alt="Admin" class="user-avatar" />
          <span class="user-name">Admin User</span>
          <span class="material-icons">arrow_drop_down</span>
        </div>
      </div>
    </header>

 <!-- Report Content -->
<div class="content">
  <div class="container">
    <div class="page-header">
      <h2>Submit Admin Report</h2>
      <p>Use this form to report issues related to members, payments, or documents.</p>
    </div>

    <form id="reportForm" class="form-container">
      <div class="form-group">
        <label for="reportType">Report Type</label>
        <select id="reportType" name="reportType" required>
          <option value="">-- Select Report Type --</option>
          <option value="misconduct">User Misconduct</option>
          <option value="payment">Payment Renewal Issue</option>
          <option value="document">Document Rejection</option>
        </select>
      </div>

      <div class="form-group">
        <label for="memberName">Member Name or Email</label>
        <input type="text" id="memberName" name="memberName" placeholder="Enter member's name or email" required />
      </div>

      <div class="form-group">
        <label for="reportReason">Description / Reason</label>
        <textarea id="reportReason" name="reportReason" rows="6" placeholder="Describe the issue..." required></textarea>
      </div>

      <div class="form-group">
        <label for="reportDate">Report Date</label>
        <input type="date" id="reportDate" name="reportDate" required />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Submit Report</button>
      </div>
    </form>

    <div id="reportSuccess" class="success-message" style="display: none;">
      ✅ Report successfully submitted!
    </div>
  </div>
</div>

  </main>

  <script>
    document.getElementById('reportForm').addEventListener('submit', function(event) {
      event.preventDefault();

      // Example submission logic
      const form = event.target;
      const reportData = {
        type: form.reportType.value,
        member: form.memberName.value,
        reason: form.reportReason.value,
        date: form.reportDate.value,
      };

      console.log('Report submitted:', reportData);

      // Show success message
      document.getElementById('reportSuccess').style.display = 'block';

      // Clear form
      form.reset();
    });
  </script>
</body>
</html>
