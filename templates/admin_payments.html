<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payments - KACCIMA Admin Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script src="../script.js" defer></script>
  
</head>
<body>
  <!-- Sidebar -->
 {{template "adminSideNav"}}


  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <span class="material-icons" id="sidebarToggle" style="cursor: pointer;">menu</span>
      </div>
      <div class="header-right">
        <div class="user-profile">
          <img src="https://randomuser.me/api/portraits/men/2.jpg" alt="Admin" class="user-avatar" />
          <span class="user-name">Admin User</span>
          <span class="material-icons">arrow_drop_down</span>
        </div>
      </div>
    </header>

    <!-- Content -->
    <div class="content">
      <div class="page-header">
        <h2>Transaction History</h2>
        <div class="search-box">
          <span class="material-icons">search</span>
          <input type="text" id="searchPayments" placeholder="Search payments..." />
        </div>
      </div>

      <div class="table-container">
        <table id="paymentsTable">
          <thead>
            <tr>
              <th>Member</th>
              <th>Amount</th>
              <th>Payment Method</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
          {{range .}}
            <tr>
              <td>{{.OrganizationName}}</td>
              <td>₦200,000</td>
              <td>{{.PaymentMethod}}</td>
              <td>{{.Day}}-{{.Month}}-{{.Year}}</td>  
              <td><span class="status verified">{{.Status}}</span></td>
              <td>
                <button class="action-btn btn-view" onclick="showPaymentDetails(`{{.OrganizationName}}`, '₦200,000', `{{.PaymentMethod}}`, `{{.Day}}-{{.Month}}-{{.Year}}`, `{{.Date}}`)">Details</button>
              </td>
            </tr>
            {{end}}
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Transaction Details Modal -->
  <div class="modal" id="paymentModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Payment Details</h3>
        <button class="close-btn" onclick="closePaymentModal()">&times;</button>
      </div>
      <div class="modal-body" id="paymentDetails">
        <!-- Details will be inserted here dynamically -->
      </div>
    </div>
  </div>

  <script>
    function showPaymentDetails(member, amount, method, date, status) {
      const modal = document.getElementById('paymentModal');
      const details = document.getElementById('paymentDetails');
      details.innerHTML = `
        <p><strong>Member:</strong> ${member}</p>
        <p><strong>Amount:</strong> ${amount}</p>
        <p><strong>Payment Method:</strong> ${method}</p>
        <p><strong>Date:</strong> ${date}</p>
        <p><strong>Status:</strong> ${status}</p>
      `;
      modal.style.display = 'block';
    }

    function closePaymentModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    // Optional: Close modal on outside click
    window.onclick = function(event) {
      const modal = document.getElementById('paymentModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }
  </script>
</body>
</html>
