<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payments - KACCIMA Admin Dashboard</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script src="../script.js" defer></script>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background-image: url('../static/bg.jpg');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
  }

  .main-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .header {
    height: 60px;
    background-color: #f5f5f5;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    flex-shrink: 0;
  }

  .user-profile {
    display: flex;
    align-items: center;
  }

  .user-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    margin-right: 10px;
  }

  .content {
    padding: 20px;
    flex: 1;
    overflow: auto;
    display: flex;
    flex-direction: column;
    background-color: #ffffff;
    margin: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: #fff;
    padding: 6px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .search-box input {
    border: none;
    outline: none;
    padding: 6px;
    font-size: 14px;
  }

  .table-container {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    table-layout: auto;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 10px 12px;
    text-align: left;
  }

  th {
    background-color: #f4f4f4;
    font-weight: bold;
  }

  td:last-child {
    text-align: center;
  }

  .status {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
  }

  .verified {
    background-color: #4CAF50;
  }

  .pending {
    background-color: #FFC107;
  }

  .rejected {
    background-color: #F44336;
  }

  .action-btn {
    background-color: #2196F3;
    color: white;
    border: none;
    padding: 6px 12px;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .action-btn:hover {
    background-color: #1976D2;
  }

  /* Modal Styles */
  .modal {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.5);
  }

  .modal-content {
    background-color: #fff;
    margin: 8% auto;
    padding: 20px;
    border-radius: 8px;
    width: 90%;
    max-width: 500px;
    position: relative;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .close-btn {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #666;
  }

  .modal-body {
    margin-top: 15px;
    font-size: 14px;
  }

  .modal-body p {
    margin: 10px 0;
  }

  @media (max-width: 600px) {
    .page-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .search-box {
      width: 100%;
    }

    .action-btn {
      width: 100%;
      margin-top: 5px;
    }

    .modal-content {
      margin: 20% auto;
    }
  }
</style>

</head>

<body>
  <!-- Sidebar -->
 {{template "adminSideNav"}}


  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <header class="header">

      <div class="header-right">
        <div class="user-profile">
          <img src="../static/avater.jpg" alt="Admin" class="user-avatar" />
          <span class="user-name">Admin User</span>
          <span class="material-icons">arrow_drop_down</span>
        </div>
      </div>
    </header>

    <!-- Content -->
    <div class="content">
      <div class="page-header">
        <h2>Transaction History</h2>
        <div class="search-box">
          <span class="material-icons">search</span>
          <input type="text" id="searchPayments" placeholder="Search payments..." />
        </div>
      </div>

      <div class="table-container">
        <table id="paymentsTable">
          <thead>
            <tr>
              <th>Member</th>
              <th>Amount</th>
              <th>Payment Method</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
          {{range .}}
            <tr>
              <td>{{.OrganizationName}}</td>
              <td>₦200,000</td>
              <td>{{.PaymentMethod}}</td>
              <td>{{.Day}}-{{.Month}}-{{.Year}}</td>  
              <td><span class="status verified">{{.Status}}</span></td>
              <td>
                <button class="action-btn btn-view" onclick="showPaymentDetails(`{{.OrganizationName}}`, '₦200,000', `{{.PaymentMethod}}`, `{{.Day}}-{{.Month}}-{{.Year}}`, `{{.Date}}`)">Details</button>
              </td>
            </tr>
            {{end}}
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Transaction Details Modal -->
  <div class="modal" id="paymentModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Payment Details</h3>
        <button class="close-btn" onclick="closePaymentModal()">&times;</button>
      </div>
      <div class="modal-body" id="paymentDetails">
        <!-- Details will be inserted here dynamically -->
      </div>
    </div>
  </div>

  <script>
    function showPaymentDetails(member, amount, method, date, status) {
      const modal = document.getElementById('paymentModal');
      const details = document.getElementById('paymentDetails');
      details.innerHTML = `
        <p><strong>Member:</strong> ${member}</p>
        <p><strong>Amount:</strong> ${amount}</p>
        <p><strong>Payment Method:</strong> ${method}</p>
        <p><strong>Date:</strong> ${date}</p>
        <p><strong>Status:</strong> ${status}</p>
      `;
      modal.style.display = 'block';
    }

    function closePaymentModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    // Optional: Close modal on outside click
    window.onclick = function(event) {
      const modal = document.getElementById('paymentModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }
  </script>
</body>
</html>
