<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - KACCIMA</title>
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      min-height: 80vh;
    }
    .auth-form {
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .auth-form h2 {
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #006400;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .mui-alert {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      font-family: 'Roboto', sans-serif;
      box-shadow: 0 3px 5px rgba(0,0,0,0.2);
      z-index: 1000;
      max-width: 350px;
      animation: fadeIn 0.3s;
    }
    .mui-alert-success {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .mui-alert-error {
      background-color: #ffebee;
      color: #c62828;
    }
    .mui-alert-icon {
      margin-right: 12px;
      font-size: 24px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <main class="auth-container">
    <div class="auth-form">
      <h2>Enter New Password</h2>
      {{if .}}
        {{.}}
      {{end}}
      <form id="forgotPasswordForm" action="/reset_password_handler" method="post">
        <div class="form-group">
          <label for="forgotEmail">Enter your registered email</label>
          <input type="email" id="forgotEmail" name="email" value="{{.}}" required>
        </div>
        <div class="form-group">
          <label for="forgotEmail">Enter Your New Password</label>
          <input type="text" id="forgotEmail" name="newPassword" required>
        </div>        
        <button type="submit" class="btn">Save New Password</button>
      </form>
      <div class="auth-links">
        <p>Remembered your password? <a href="login.html">Login</a></p>
      </div>
    </div>
  </main>

  <script>
  </script>
</body>
</html>
