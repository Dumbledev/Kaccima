<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KACCIMA - Login</title>
    <link rel="stylesheet" href="/static/styles.css">
    <!-- Add Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* Material UI Alert Styles Only */
        .mui-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            font-family: 'Roboto', sans-serif;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 350px;
            animation: fadeIn 0.3s;
        }
        .mui-alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        .mui-alert-error {
            background-color: #ffebee;
            color: #c62828;
        }
        .mui-alert-icon {
            margin-right: 12px;
            font-size: 24px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="/static/logo.png" alt="KACCIMA Logo" width="40" height="40">
                <span class="logo-text">KACCIMA</span>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-form">
            <h2>User Details</h2>
            <form id="loginForm" method="post" action="/profile_update_handler">
                <input type="text" id="loginEmail" name="userId" placeholder="" hidden value="{{.User.ID}}" required>
                <div class="form-group">
                    <label for="loginEmail">Email </label>
                    <input type="email" id="loginEmail" name="email" placeholder="Email" value="{{.User.Email}}" required>
                </div>
       
                <h3>Security Question</h3>
                <div class="form-row">
                    <div class="form-group">
                    <label>Password Reset Question</label>
                    <select name="security_question"  required>
                        <option>{{.QA.Question}}</option>
                        <option value="What is your favorite food">What is your favorite food</option>
                        <option value="What is your dream job">What is your dream job</option>
                        <option value="Where were you born">Where were you born</option>
                        <option value="What is your favorite color">What is your favorite color</option>
                    </select>
                    </div>
                </div>
        
                    <div class="form-group">
                    <label for="answer">Answer</label>
                    <input type="text" id="answer" name="security_answer" value="{{.QA.Answer}}" required>
                    </div>
                <button type="submit" class="btn">Save</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 KACCIMA. All rights reserved.</p>
            <p>Contact us: info@kaccima.org | +234-123-456-7890</p>
        </div>
    </footer>
</body>
</html>
